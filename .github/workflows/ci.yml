name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      PLDL_HOME: ${{ runner.temp }}/pldl-home
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py desktop.py pldl.py pldl tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Import application modules
        run: python -c "import app, desktop, pldl; print('imports ok')"

      - name: Check CLI starts
        run: python pldl.py --help
