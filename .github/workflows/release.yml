name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      PLDL_HOME: ${{ runner.temp }}/pldl-home
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run tests
        run: |
          python -m compileall -q app.py desktop.py pldl.py pldl tests
          python -m unittest discover -s tests -v

      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $version = python -c "import pldl; print(pldl.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match pldl.__version__ ($version)."
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build PLDL.exe
        run: python -m PyInstaller --noconfirm --clean PLDL.spec

      - name: Prepare installer inputs and build uninstaller
        shell: pwsh
        run: |
          Copy-Item "dist\PLDL.exe" "PLDL.exe" -Force
          .\build_uninstaller.bat --quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe was not found." }
          & $iscc /Qp "/DMyAppVersion=$env:APP_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create SHA256 checksums
        shell: pwsh
        run: |
          $version = $env:APP_VERSION
          $files = @(
            "dist\PLDL-Setup-$version.exe",
            "PLDL.exe",
            "PLDL-Uninstall.exe"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content -Encoding ascii "dist\SHA256SUMS.txt"
          Get-Content "dist\SHA256SUMS.txt"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: PLDL ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/PLDL-Setup-*.exe
            PLDL.exe
            PLDL-Uninstall.exe
            dist/SHA256SUMS.txt
